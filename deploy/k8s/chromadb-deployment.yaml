apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
  namespace: knowflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:0.5.23
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: knowflow
spec:
  selector:
    app: chromadb
  ports:
    - port: 8000
      targetPort: 8000
