apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowflow-backend
  namespace: knowflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowflow-backend
  template:
    metadata:
      labels:
        app: knowflow-backend
    spec:
      containers:
        - name: backend
          image: knowflow-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: knowflow-config
            - secretRef:
                name: knowflow-secret
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: knowflow-backend
  namespace: knowflow
spec:
  selector:
    app: knowflow-backend
  ports:
    - port: 8000
      targetPort: 8000
