name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Docker + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build backend stack
        run: docker compose build backend celery-worker

      - name: Start dependencies
        run: docker compose up -d postgres redis chromadb backend celery-worker

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health >/dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          docker compose logs backend --tail 80
          exit 1

      - name: Run pytest
        run: docker compose exec -T backend pytest tests/ -q --tb=short

      - name: Run HTTP acceptance script
        run: |
          pip install httpx
          python scripts/e2e_acceptance.py
        working-directory: backend

  frontend:
    name: Frontend (build + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and verify
        run: |
          npm ci
          npm run build
          npm run test:run
